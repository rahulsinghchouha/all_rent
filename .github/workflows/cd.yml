name: CD

concurrency:
  group: production-deployment
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      is_current: ${{ steps.check.outputs.is_current }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify CI commit
        id: check
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          MAIN_SHA=$(git rev-parse HEAD)

          if [ "$CI_SHA" = "$MAIN_SHA" ]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
            echo "CI passed for the latest main commit."
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publish: main has advanced since this CI run."
          fi

  publish:
    needs: verify
    if: needs.verify.outputs.is_current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tested code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}